# Render Blueprint -- lets you spin up the API + database in one step.
# In the Render dashboard: New -> Blueprint -> select this repo.
# See DEPLOYMENT.md for the full walkthrough (including the manual,
# no-blueprint path).

services:
  - type: web
    name: task-manager-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --log-file -"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://REPLACE-WITH-YOUR-NETLIFY-SITE.netlify.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://REPLACE-WITH-YOUR-NETLIFY-SITE.netlify.app"

databases:
  - name: task-manager-db
    plan: free
